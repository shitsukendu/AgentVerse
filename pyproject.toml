[project]
name = "agentverse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SUKENDU SHIT", email = "sukendushit@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.3",
    "google-genai>=2.32.0",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "mcp>=2.3.0",
    "openai>=3.33.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentverse = "agentverse:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
